<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Battlecamp</title>
    <!-- viewport-fit=cover + safe-area padding below keeps the HUD clear of phone notches. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12161c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS reads its own prefixed variants. With these, "Zum Home-Bildschirm"
         launches the game without Safari's chrome eating a third of the screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Battlecamp" />
    <!-- The SVG scales to any tab size; the PNG is what iOS puts on the home
         screen, which cannot use SVG. Without these the browser asks for
         /favicon.ico on every load and gets a 404. -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="hud-top">
        <!-- Filled from the resource table at start-up, so adding a resource
             is one edit in src/sim/resources.ts and nothing here. -->
        <div class="pill resources" id="resources"></div>
        <div class="pill" id="clock">0:00</div>
        <!-- The diagnostics used to sit here as a permanently expanded pill and
             ate a third of the top row on a phone. Now they are one tap away. -->
        <button class="pill info-toggle" id="btn-info" aria-label="Status einblenden">i</button>
        <div class="pill" id="stats" hidden>–</div>
      </div>

      <!-- Overview map. Filled by src/render/minimap.ts; the wrapper exists so
           the canvas can be swapped without the layout knowing. Tapping the
           header collapses it — on a phone the corner it occupies is real
           estate, and not every player wants it there all the time. -->
      <div id="minimap-panel">
        <button id="minimap-toggle" aria-label="Übersichtskarte ausblenden" aria-expanded="true">
          <span id="minimap-caret">▾</span>
        </button>
        <div id="minimap-slot"></div>
      </div>

      <!-- Panel and controls travel together, hard against the bottom edge:
           on a phone that is the half of the screen a thumb can actually
           reach, and the panel is where the way out of a selection lives. -->
      <div id="hud-lower">
        <!-- Context panel: what the current selection can do. Empty when nothing
             is selected, so it never takes up room it has not earned. -->
        <div id="hud-context" hidden>
          <div id="context-head">
            <div id="context-title"></div>
            <!-- The way out. Until this existed, the only way to clear a
                 selection was to make another one — and with something
                 selected, a tap on open ground is a move order. -->
            <button id="context-dismiss" aria-label="Auswahl aufheben">×</button>
          </div>
          <div id="context-actions"></div>
        </div>

        <div id="hud-bottom">
          <button class="ctrl" id="btn-pause" aria-label="Pause">⏸</button>
          <!-- One button, not three: in portrait the row used to run off the
               screen, and the first thing lost was the help button. Tapping
               cycles 1x, 2x, 4x and back. -->
          <button class="ctrl" id="btn-speed">▶︎</button>
          <button class="ctrl" id="btn-center" aria-label="Zur eigenen Basis">⌖</button>
          <!-- Touch has no right mouse button, so box-select needs its own mode. -->
          <button class="ctrl" id="btn-select" aria-label="Auswahlmodus">⬚</button>
          <button class="ctrl" id="btn-build" aria-label="Bauen">🔨</button>
          <button class="ctrl" id="btn-attack" aria-label="Angriffsbewegung">⚔</button>
          <button class="ctrl" id="btn-legend" aria-label="Legende und Anleitung">?</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
